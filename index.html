<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TruthLens</title>
    <link rel="icon" type="image/svg+xml" href="/assets/image/favicon/seo.ico">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
   <header>
        <a class="navbar-brand fw-bold text-primary">TRUTHLENS</a>
        <!-- navbar-brand: define o nome/logo do site dentro do menu
        fw-bold: deixa a fonte em negrito
        text-primary: coloca a cor azul padrão do Bootstrap -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <!-- navbar: cria um menu Bootstrap
            navbar-expand-lg: faz o menu ficar horizontal em telas grandes e virar "hambúrguer" no celular
            navbar-dark: define texto claro para fundos escuros
            bg-dark: define fundo escuro -->
            <div class="container">
            <!-- container: centraliza o conteúdo e cria margens automáticas -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                    <span class="navbar-toggler-icon"></span>
                    <!-- navbar-toggler-icon: ícone do botão hamburguer -->
                </button>
        
                <div class="collapse navbar-collapse" id="menu">
                    <ul class="navbar-nav mx-auto gap-3 align-items-center">
                    <!-- navbar-nav: define uma lista de itens do menu Bootstrap
                    mx-auto: centraliza a lista no meio do menu (margin left e right automáticos)
                    gap-3: cria espaço entre os itens do menu
                    align-items-center: alinha os itens verticalmente no centro -->
                        <li class="nav-itam">
                            <a href="/pages/login.html" class="btn btn-outline-light login-btn">
                                Login / Cadastro
                            </a>
                        </li>
                        <li class="nav-itam"> 
                            <a class="nav-link" href="#">Denúncia</a>
                        </li>
                        <li class="nav-itam"> 
                            <a class="nav-link" href="#">Contato</a>
                        </li>
                        <li class="nav-itam"> 
                            <a class="nav-link" href="#">Sobre o site</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
   </header>

    <main class="container mt-4">
        <!-- mt-4: adiciona margem em cima (margin-top)-->
        <div class="row g-4">
            <!-- row: cria uma linha do grid
            g-4: cria espaçamento entre colunas e linhas -->
            <div class="col-12 col-md col-lg-4">
            <!-- col-12: no celular ocupa 12 colunas (100% de largura)
             col-md-6: em telas médias ocupa 50% de largura
             col-lg-4: em telas grandes ocupa 3% de largura -->
                <div class="card info-card h-100 text-center">
                    <!-- card: cria um cartão bootstrap-->
                     <img src="/assets/image/image-desenvolvimento-desktop1.png" class="card-img-top p-4">
                     <!-- card-img-top: imagem padrão no topo do card
                     p-4: adiciona padding (espaçamento interno) -->
                    <div class="card-body">
                        <h5 class="card-title"> Denúncias </h5>
                        <p class="card-text"> Envie denúncias públicas de forma segura e anônima</p>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md col-lg-4">
                <div class="card card-info h-100 text-center">
                    <div class="card-body">
                        <h5 class="card-title"> Segurança </h5>
                        <p class="card-text">
                            Seus dados são protegidos com total segurança
                        </p>
                    </div>
                </div>
            </div>

            <div class="col-12 col-lg-4">
                <div class="card card-info h-100 text-center">
                    <div class="card-body">
                        <h5 class="card-title"> Transparência </h5>
                        <p class="card-text">
                            Acompanhe o andamento das denúncias
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center text-light mt-5 m b-3">
        <!-- mt-5: Margem grande em cima 
            mb-3-->
        Desenvolvido para o seu bem-estar
    </footer>
     <!-- Script do Bootstrap para funcionar o menu hambúrguer -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
